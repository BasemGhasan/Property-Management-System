name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend to Elastic Beanstalk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish
        run: |
          cd "Back End/PropertyManagement.API"
          dotnet publish -c Release -o ./publish --self-contained true -r linux-x64

      - name: Zip artifact
        run: |
          cp -r "Back End/PropertyManagement.API/.ebextensions" "Back End/PropertyManagement.API/publish/.ebextensions"
          cp -r "Back End/PropertyManagement.API/.platform" "Back End/PropertyManagement.API/publish/.platform"
          chmod +x "Back End/PropertyManagement.API/publish/.platform/hooks/postdeploy"/*.sh
          cd "Back End/PropertyManagement.API/publish"
          zip -r ../app.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk
        run: |
          VERSION="deploy-${{ github.sha }}"
          BUCKET="elasticbeanstalk-${{ secrets.AWS_REGION }}-137068252948"

          aws s3 cp "Back End/PropertyManagement.API/app.zip" "s3://$BUCKET/$VERSION.zip"

          aws elasticbeanstalk create-application-version \
            --application-name "${{ secrets.EB_APP_NAME }}" \
            --version-label "$VERSION" \
            --source-bundle S3Bucket="$BUCKET",S3Key="$VERSION.zip"

          aws elasticbeanstalk update-environment \
            --application-name "${{ secrets.EB_APP_NAME }}" \
            --environment-name "${{ secrets.EB_ENV_NAME }}" \
            --version-label "$VERSION"

  deploy-frontend:
    name: Deploy Frontend to S3 + CloudFront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "Front End/package-lock.json"

      - name: Install dependencies
        working-directory: Front End
        run: npm ci

      - name: Build
        working-directory: Front End
        run: npm run build
        env:
          VITE_API_URL: https://d3a7xbmvcwhxka.cloudfront.net
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_THUMBNAIL_API_URL: ${{ secrets.VITE_THUMBNAIL_API_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 sync "Front End/dist/" s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
            --paths "/*"
